services:
  # tempo, backend and kafka
  tempo:
    image: grafana/tempo:latest
    depends_on:
      - redpanda
    command: '-target=all -config.file=/etc/tempo.yaml'
    restart: always
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - ./tempo-data:/var/tempo
    ports:
      - '3200:3200' # tempo
      - '4317:4317' # Tempo OTLP GRPC
      - '4318:4318' # Tempo OTLP HTTP
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - '9001:9001'
    entrypoint:
      - sh
      - -euc
      - mkdir -p /data/tempo && minio server /data --console-address ':9001'

  redpanda:
    image: redpandadata/redpanda:latest
    ports:
      - '9092:9092' # Kafka API for clients
    command: >
      redpanda start --overprovisioned
      --mode=dev-container
      --kafka-addr=PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr=PLAINTEXT://redpanda:9092

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.5.0@sha256:b2cbdd93dee412142f95a61488118f33b8e31ea576bfb3ce625fbaffbdf0803a
    environment:
      - CONFIG_FILEPATH=/etc/redpanda/redpanda-console-config.yaml
    volumes:
      - ./redpanda-console.yaml:/etc/redpanda/redpanda-console-config.yaml
    ports:
      - '8088:8080'
    depends_on:
      - redpanda

  # ingest pipeline
  k6-tracing:
    image: ghcr.io/grafana/xk6-client-tracing:v0.0.9
    environment:
      - ENDPOINT=alloy:4317
    restart: always
    depends_on:
      - tempo
      - alloy

  alloy:
    image: grafana/alloy:v1.13.1@sha256:03529aec781901a72a354809650028435043406e707c6fb8953dc6e48f97727d
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      - ALLOY_OTLP_UPSTREAM=tempo:4317
    ports:
      - '12345:12345'
      - '4319:4317'
    depends_on:
      - tempo

  # supporting services - metrics, visualization and testing
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yaml:/etc/prometheus.yaml
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:12.3.3@sha256:9e1e77ade304069aee3196e9a4f210830e96e80ce9a2640891eccc324b152faf
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor metricsSummary
    ports:
      - '3000:3000'

  vulture:
    image: grafana/tempo-vulture:latest
    restart: always
    command:
      [
        '-prometheus-listen-address=:8080',
        '-tempo-query-url=http://tempo:3200',
        '-tempo-push-url=http://tempo:4317',
      ]
    depends_on:
      - tempo

  # self-hosted sentry-compatible error tracking
  sentry-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=glitchtip
      - POSTGRES_USER=glitchtip
      - POSTGRES_PASSWORD=glitchtip
    volumes:
      - sentry_db_data:/var/lib/postgresql/data

  sentry-redis:
    image: redis:8.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - sentry_redis_data:/data

  sentry:
    image: glitchtip/glitchtip:latest
    depends_on:
      - sentry-db
      - sentry-redis
    environment:
      - DATABASE_URL=postgres://glitchtip:glitchtip@sentry-db:5432/glitchtip
      - REDIS_URL=redis://sentry-redis:6379/1
      - SECRET_KEY=change-me-for-production
      - PORT=8000
      - GLITCHTIP_DOMAIN=http://localhost:8001
      - DEFAULT_FROM_EMAIL=glitchtip@example.com
      - ENABLE_OPEN_USER_REGISTRATION=true
    command: ./bin/run-migrate && ./bin/start-web
    ports:
      - '8001:8000'

  sentry-worker:
    image: glitchtip/glitchtip:latest
    depends_on:
      - sentry
    environment:
      - DATABASE_URL=postgres://glitchtip:glitchtip@sentry-db:5432/glitchtip
      - REDIS_URL=redis://sentry-redis:6379/1
      - SECRET_KEY=change-me-for-production
      - PORT=8000
      - GLITCHTIP_DOMAIN=http://localhost:8001
      - DEFAULT_FROM_EMAIL=glitchtip@example.com
    command: ./bin/start-worker

volumes:
  sentry_db_data:
  sentry_redis_data:
