definitions:
  dto.AccessTokenCreateOneDto:
    properties:
      expireTime:
        type: integer
      name:
        type: string
      owner:
        type: integer
    required:
    - expireTime
    - name
    - owner
    type: object
  dto.AuthLoginWithAccountDto:
    properties:
      email:
        type: string
      password:
        maxLength: 32
        minLength: 12
        type: string
      redirect_url:
        type: string
    required:
    - email
    - password
    type: object
  dto.PostCreateOneDto:
    properties:
      category:
        allOf:
        - $ref: '#/definitions/post.Category'
        enum:
        - Feed
        - Story
      content:
        type: string
      title:
        type: string
    required:
    - category
    - content
    - title
    type: object
  dto.UserGetByIdDto:
    properties:
      id:
        minimum: 1
        type: integer
    required:
    - id
    type: object
  ent.AccessTokenEntity:
    properties:
      createTime:
        type: string
      creator:
        type: integer
      id:
        type: integer
      name:
        type: string
      owner:
        type: integer
      updateTime:
        type: string
    type: object
  ent.PostEntity:
    properties:
      category:
        $ref: '#/definitions/post.Category'
      content:
        type: string
      createTime:
        type: string
      id:
        type: integer
      title:
        type: string
      updateTime:
        type: string
    type: object
  ent.UserEntity:
    properties:
      createTime:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      posts:
        items:
          $ref: '#/definitions/ent.PostEntity'
        type: array
      updateTime:
        type: string
    type: object
  errors.APIError:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  post.Category:
    enum:
    - Feed
    - Story
    type: string
    x-enum-varnames:
    - CategoryFeed
    - CategoryStory
  response.AccessTokenAPIResponse:
    properties:
      code:
        example: 200
        type: integer
      message:
        example: success
        type: string
      payload:
        $ref: '#/definitions/ent.AccessTokenEntity'
    type: object
  response.AccessTokenListAPIResponse:
    properties:
      code:
        example: 200
        type: integer
      message:
        example: success
        type: string
      payload:
        items:
          $ref: '#/definitions/ent.AccessTokenEntity'
        type: array
    type: object
  response.PostAPIResponse:
    properties:
      code:
        example: 200
        type: integer
      message:
        example: success
        type: string
      payload:
        $ref: '#/definitions/ent.PostEntity'
    type: object
  response.UserAPIResponse:
    properties:
      code:
        example: 200
        type: integer
      message:
        example: success
        type: string
      payload:
        $ref: '#/definitions/ent.UserEntity'
    type: object
host: localhost:4000
info:
  contact: {}
  description: This is a sample server Petstore server.
  title: Gin APP API
  version: "1.0"
paths:
  /api/v1/access-tokens:
    get:
      description: Retrieves access tokens owned by the authenticated user
      operationId: AccessTokenGetSelfTokens
      produces:
      - application/json
      responses:
        "200":
          description: List of access tokens
          schema:
            $ref: '#/definitions/response.AccessTokenListAPIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.APIError'
      security:
      - APIAuth: []
      summary: Get self access tokens
      tags:
      - AccessTokens
    post:
      consumes:
      - application/json
      description: Creates a new access token resource
      operationId: AccessTokenCreateOne
      parameters:
      - description: AccessToken data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.AccessTokenCreateOneDto'
      produces:
      - application/json
      responses:
        "200":
          description: Post created successfully
          schema:
            $ref: '#/definitions/response.AccessTokenAPIResponse'
        "400":
          description: Bad request (invalid params)
          schema:
            $ref: '#/definitions/errors.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.APIError'
      security:
      - APIAuth: []
      summary: Create a new access token
      tags:
      - AccessTokens
  /api/v1/access-tokens/{owner}:
    get:
      description: Retrieves access tokens owned by the specified user
      operationId: AccessTokenGetByOwner
      parameters:
      - description: Owner ID
        in: path
        name: owner
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of access tokens
          schema:
            $ref: '#/definitions/response.AccessTokenListAPIResponse'
        "400":
          description: Bad request (invalid ID)
          schema:
            $ref: '#/definitions/errors.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.APIError'
      security:
      - APIAuth: []
      summary: Get access tokens by owner
      tags:
      - AccessTokens
  /api/v1/auth/login:
    get:
      description: Redirects the user to GitHub's OAuth2 login page for authentication
      operationId: AuthLogin
      parameters:
      - description: URL to redirect after successful login
        in: query
        name: redirect
        required: true
        type: string
      - description: Preferred language
        in: query
        name: lang
        type: string
      responses:
        "302":
          description: Redirects to GitHub OAuth2 login page
        "400":
          description: Bad request (invalid params)
          schema:
            $ref: '#/definitions/errors.APIError'
      summary: Redirect to GitHub OAuth2 login page
      tags:
      - Auth
  /api/v1/auth/login-with-account:
    post:
      consumes:
      - application/json
      description: Login with account
      operationId: AuthLoginWithAccount
      parameters:
      - description: Login data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.AuthLoginWithAccountDto'
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to login page
          schema:
            type: string
        "400":
          description: Bad request (invalid params)
          schema:
            $ref: '#/definitions/errors.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.APIError'
      summary: Login with account
      tags:
      - Auth
  /api/v1/posts:
    post:
      consumes:
      - application/json
      description: Creates a new post resource
      operationId: PostCreateOne
      parameters:
      - description: Post data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.PostCreateOneDto'
      produces:
      - application/json
      responses:
        "200":
          description: Post created successfully
          schema:
            $ref: '#/definitions/response.PostAPIResponse'
        "400":
          description: Bad request (invalid params)
          schema:
            $ref: '#/definitions/errors.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.APIError'
      security:
      - APIAuth: []
      summary: Create a new post
      tags:
      - Posts
  /api/v1/posts/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve post information by given post ID
      operationId: GetPostById
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved post
          schema:
            $ref: '#/definitions/response.PostAPIResponse'
        "400":
          description: Bad request (invalid ID)
          schema:
            $ref: '#/definitions/errors.APIError'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/errors.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.APIError'
      security:
      - APIAuth: []
      summary: Get post by ID
      tags:
      - Posts
  /api/v1/users:
    post:
      consumes:
      - application/json
      description: Creates a new user account
      operationId: UserCreateOne
      parameters:
      - description: User data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.UserGetByIdDto'
      produces:
      - application/json
      responses:
        "200":
          description: User created successfully
          schema:
            $ref: '#/definitions/response.UserAPIResponse'
        "400":
          description: Bad request (invalid params)
          schema:
            $ref: '#/definitions/errors.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.APIError'
      summary: Create a new user
      tags:
      - Users
  /api/v1/users/{id}:
    get:
      description: Retrieve user information by given user ID
      operationId: getUserById
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved user
          schema:
            $ref: '#/definitions/response.UserAPIResponse'
        "400":
          description: Bad request (invalid ID)
          schema:
            $ref: '#/definitions/errors.APIError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/errors.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.APIError'
      security:
      - APIAuth: []
      summary: Get user by ID
      tags:
      - Users
securityDefinitions:
  APIAuth:
    in: cookie
    name: app_cookie_name
    type: apiKey
  OpenAPIAuth:
    in: header
    name: PRIVATE-TOKEN
    type: apiKey
swagger: "2.0"
