version: '3.9'

x-db-environment: &x-db-environment
  POSTGRES_DB: 'db'
  POSTGRES_PASSWORD: 'apppassword'
  POSTGRES_USER: 'user'

x-redis-environment: &x-redis-environment
  REDIS_PASSWORD: 'yourpassword'

x-rabbitmq-variables: &x-rabbitmq-variables
  RABBITMQ_DEFAULT_USER: 'guest'
  RABBITMQ_DEFAULT_PASS: 'guest'

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: '1'
  # App
  APP_NAME: 'gin-app'
  APP_VERSION: '1.0.0'
  APP_ENV: 'development'
  # HTTP settings
  HTTP_PORT: '8080'
  HTTP_USE_PREFORK_MODE: 'false'
  HTTP_COOKIE_NAME: 'app_cookie_name'
  # JWT
  JWT_SECRET: 'jwt_secret'
  # Logger
  LOG_DIR: '/tmp/logs'
  LOG_LEVEL: 'debug'
  # PG
  PG_POOL_MAX: '2'
  PG_URL: 'postgres://user:apppassword@db:5432/db?sslmode=disable'
  # Redis
  REDIS_URL: 'redis://:yourpassword@redis:6379/0'
  # gRPC
  GRPC_PORT: '8081'
  # RMQ
  RMQ_RPC_SERVER: 'rpc_server'
  RMQ_RPC_CLIENT: 'rpc_client'
  RMQ_URL: 'amqp://guest:guest@rabbitmq:5672/'
  # NATS
  NATS_RPC_SERVER: 'rpc_server'
  NATS_URL: 'nats://guest:guest@nats:4222/'
  # Sentry
  SENTRY_DSN: 'https://public@example.com/1'
  # Metrics
  METRICS_ENABLED: 'true'
  # Swagger
  SWAGGER_ENABLED: 'true'
  # Google OAuth2
  GOOGLE_CLIENT_ID: 'google_client_id'
  GOOGLE_CLIENT_SECRET: 'google_client_secret'
  GOOGLE_REDIRECT_URL: 'http://localhost:8080/api/v1/auth/google/callback'
  # Github OAuth2
  GITHUB_CLIENT_ID: 'github_client_id'
  GITHUB_CLIENT_SECRET: 'github_client_secret'
  GITHUB_REDIRECT_URL: 'http://localhost:8080/api/v1/auth/github/callback'

services:
  db:
    container_name: db
    image: postgres:18-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      app_network:
        aliases:
          - db.lvh.me

  redis:
    container_name: redis
    image: redis:8.4-alpine
    environment:
      <<: *x-redis-environment
    volumes:
      - redis_data:/data
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '$$REDIS_PASSWORD',
      ]
    ports:
      - '6379:6379'
    networks:
      app_network:
        aliases:
          - redis.lvh.me

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.2.4-management
    environment:
      <<: *x-rabbitmq-variables
    ports:
      - '15672:15672'
      - '5672:5672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      app_network:
        aliases:
          - rabbitmq.lvh.me

  nats:
    container_name: nats
    image: nats:2.12-alpine
    command:
      ['-m', '8222', '-sd', '/nats-data', '-user', 'guest', '-pass', 'guest']
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats_data:/nats-data
    networks:
      app_network:
        aliases:
          - nats.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: 'host'
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - '8080:8080'
      - '8081:8081'
    depends_on:
      - db
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.29.2-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - '80:80'
    depends_on:
      - rabbitmq
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me

networks:
  app_network:
    external: false

volumes:
  db_data:
  redis_data:
  rabbitmq_data:
  nats_data:
