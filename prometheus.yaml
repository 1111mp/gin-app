global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "tempo"
    static_configs:
      - targets:
          - "tempo:3200"
  - job_name: "vulture"
    static_configs:
      - targets:
          - "vulture:8080"
  - job_name: "gin-app"
    static_configs:
      - targets:
          - "host.docker.internal:4000"
    metrics_path: "/api/v1/metrics"
